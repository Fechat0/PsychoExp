function renderAdvice(){
 const d=state.day_index+1,log=state.advice_log.find(x=>x.day===d);
 if(d>=9)return '<div class="advisor"><div class="advisor-top"><div class="advisor-title">顾问服务状态</div><span class="advisor-mark">OFFLINE</span></div><p class="advice-copy">系统维护中 / 顾问暂时失联。该交易日无法获取顾问建议，请依据现有信息独立决策。</p></div>';
 if(!log)return '<div class="advisor"><div class="advisor-top"><div class="advisor-title">顾问研究意见</div><span class="advisor-mark">'+(state.group_type==='human'?'ANALYST DESK':'AI SIGNAL')+'</span></div><p class="advice-copy">尚未获取今日建议。你可以主动获取，也可以跳过并独立决策。</p><div class="advice-footer"><button class="btn secondary" id="getAdvice">获取今日建议 ↗</button></div></div>';
 const rec=log.recommendation,cls=rec==='BUY'?'buy':(rec==='SELL'?'sell':'hold'),label={BUY:'建议买入',SELL:'建议卖出',HOLD:'建议持有'}[rec]||'建议观察';
 return '<div class="advisor"><div class="advisor-top"><div class="advisor-title">顾问研究意见</div><span class="advisor-mark">'+(log.source==='edge'?'EDGE FUNCTION':'SCRIPT FALLBACK')+'</span></div><p class="advice-copy">'+esc(log.advice_text)+'</p><div class="advice-footer"><span class="tag '+cls+'">'+label+' · '+rec+'</span><span class="tag">目标仓位 '+Number(log.target_position_pct)+'%</span></div></div>';
}
function renderTrade(){
 const q=MARKET[state.day_index],a=asset(q.price),dailyPct=state.day_index===0?0:(q.price/MARKET[state.day_index-1].price-1)*100,rec=state.current_action;
 const trans=state.transition?'<div class="notice '+(state.transition.amount>=0?'positive':'negative')+'">资产变化：'+(state.transition.amount>=0?'+':'')+money(state.transition.amount)+'（进入第 '+state.transition.toDay+' 日）</div>':'';
 const dayRecord=state.daily_trades.find(x=>x.day===state.day_index+1);
 const canTrade=!rec;
 app.innerHTML=renderSteps(2)+'<div class="market-head"><div><div class="eyebrow">LIVE SIMULATION / DAY '+String(q.day).padStart(2,'0')+'</div><h1>交易决策台</h1><div class="sub">被试 '+esc(state.subject_id)+' · '+(state.group_type==='human'?'高级分析师组':'AI 系统组')+'</div></div><div class="pill">'+q.date+'</div></div><div class="daystrip">'+MARKET.map((x,i)=>'<div class="daydot '+(i===state.day_index?'active':(i<state.day_index?'done':''))+'">D'+(i+1)+'</div>').join('')+'</div><div class="grid" style="margin-top:16px"><section class="card span-8"><div class="market-head"><div><div class="sub">PX-001 · 实验模拟股票</div><div class="quote"><strong>'+money(q.price)+'</strong><span class="'+(dailyPct>0?'positive':(dailyPct<0?'negative':'neutral'))+'">'+(dailyPct>0?'+':'')+dailyPct.toFixed(2)+'%</span></div><div class="sub">'+esc(q.headline)+' · '+q.date+'</div></div><span class="pill">SIMULATED</span></div><div class="chartbox">'+sparkline()+'</div><div class="sub">预设模拟行情曲线 · 价格单位：元</div></section><section class="card span-4"><div class="section-title"><h2>账户资产</h2><span class="pill">CNY</span></div><div class="metrics" style="grid-template-columns:1fr 1fr"><div class="metric"><div class="label">可用现金</div><div class="value" style="font-size:18px">'+money(state.cash)+'</div></div><div class="metric"><div class="label">持有股数</div><div class="value" style="font-size:18px">'+state.shares.toLocaleString('zh-CN')+'</div></div><div class="metric" style="grid-column:span 2"><div class="label">账户总资产</div><div class="value">'+money(a)+'</div></div></div></section><section class="card span-12"><div class="section-title"><div><h2>顾问建议</h2><div class="sub">建议为可选信息，最终交易决定由你作出</div></div><span class="pill">ADVISORY</span></div>'+renderAdvice()+'</section><section class="card span-12"><div class="section-title"><div><h2>自主交易</h2><div class="sub">当前价格 '+money(q.price)+' · 买入按可用现金校验，卖出按实际持仓校验</div></div><span class="pill">'+(canTrade?'待决策':'今日已完成')+'</span></div><div class="trade-controls"><div class="field"><label for="shareQty">交易股数（整数）</label><input id="shareQty" type="number" min="1" step="1" placeholder="输入买入或卖出股数" '+(canTrade?'':'disabled')+'></div><button class="btn primary" id="buyBtn" '+(canTrade?'':'disabled')+'>买入</button><button class="btn danger" id="sellBtn" '+(canTrade?'':'disabled')+'>卖出</button></div><div class="quick"><button class="btn secondary" id="quickBuy" '+(canTrade?'':'disabled')+'>买入 1000 股</button><button class="btn secondary" id="quickSell" '+(canTrade?'':'disabled')+'>卖出全部</button><button class="btn ghost" id="quickHold" '+(canTrade?'':'disabled')+'>今日不操作</button></div><div class="status" id="tradeStatus">'+(rec?'今日已记录：'+(rec.type==='BUY'?'买入 '+rec.quantity+' 股':(rec.type==='SELL'?'卖出 '+rec.quantity+' 股':'今日不操作')):'请完成今日交易决策。')+'</div><div class="divider"></div><div class="bottomrow"><div class="sub">每日仅提交一次交易决策；确认后不可返回修改。</div><button class="btn primary" id="nextDay" '+(rec?'':'disabled')+'>'+(state.day_index===9?'完成交易并进入问卷':'进入下一交易日 →')+'</button></div></section></div>';
 const get=document.getElementById('getAdvice');if(get)get.onclick=getAdvice;
 document.getElementById('buyBtn').onclick=()=>executeTrade('BUY',Number(document.getElementById('shareQty').value));
 document.getElementById('sellBtn').onclick=()=>executeTrade('SELL',Number(document.getElementById('shareQty').value));
 document.getElementById('quickBuy').onclick=()=>executeTrade('BUY',1000);
 document.getElementById('quickSell').onclick=()=>executeTrade('SELL',state.shares);
 document.getElementById('quickHold').onclick=()=>executeTrade('HOLD',0);
 document.getElementById('nextDay').onclick=advanceDay;
}
function localFallback(day,group){
 const s=SCRIPT[day-1];if(!s)return {recommendation:'OFFLINE',target_position_pct:null,advice_text:'系统维护中 / 顾问暂时失联。',source:'fallback'};
 return {recommendation:s.action,target_position_pct:s.target,advice_text:group==='human'?s.human:s.ai,source:'fallback'};
}
async function getAdvice(){
 const day=state.day_index+1;if(day>=9)return;
 if(state.advice_log.some(x=>x.day===day)){render();return}
 const body={group_type:state.group_type,day_index:day,stock_state:{price:MARKET[state.day_index].price,cash:state.cash,shares:state.shares,total_assets:asset(),symbol:'PX-001'}};
 let advice,source='edge';
 try{
  const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),3200);
  const response=await fetch(EDGE_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},body:JSON.stringify(body),signal:ctrl.signal});clearTimeout(timer);
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  if(!data||!data.recommendation||!data.advice_text)throw new Error('Invalid advice payload');
  advice=data;
 }catch(e){console.warn('advice endpoint unavailable; use deterministic script',e);advice=localFallback(day,state.group_type);source='fallback'}
 const log={day,timestamp:new Date().toISOString(),group_type:state.group_type,recommendation:advice.recommendation,target_position_pct:advice.target_position_pct,advice_text:advice.advice_text,source:source==='fallback'?'fallback':(advice.source||'edge')};
 state.advice_log.push(log);currentRecord().advice=log;save();render();
}
function executeTrade(type,quantity){
 const status=document.getElementById('tradeStatus');if(state.current_action){status.textContent='今日交易决策已完成，不能重复操作。';return}
 if(type==='HOLD'){commitAction('HOLD',0,0);return}
 if(!Number.isInteger(quantity)||quantity<=0){status.textContent='请输入大于 0 的整数股数。';return}
 const price=MARKET[state.day_index].price,amount=quantity*price;
 if(type==='BUY'){
  if(amount>state.cash+1e-8){status.textContent='买入金额 '+money(amount)+' 超过可用现金 '+money(state.cash)+'，请减少股数。';return}
  const before={cash:state.cash,shares:state.shares};state.cash-=amount;state.shares+=quantity;commitAction('BUY',quantity,amount,before);
 }else{
  if(quantity>state.shares){status.textContent='卖出股数超过当前持仓 '+state.shares+' 股。';return}
  const before={cash:state.cash,shares:state.shares};state.cash+=amount;state.shares-=quantity;commitAction('SELL',quantity,amount,before);
 }
}
function commitAction(type,quantity,amount,before){
 const rec=currentRecord();const price=MARKET[state.day_index].price;
 state.current_action={type,quantity,price,amount:amount||0,timestamp:new Date().toISOString()};
 rec.action={...state.current_action,before:before||{cash:state.cash,shares:state.shares},after:{cash:state.cash,shares:state.shares}};
 rec.cash_after=state.cash;rec.shares_after=state.shares;rec.assets_after=asset(price);save();render();
}
function advanceDay(){
 if(!state.current_action){alert('请先完成今日决策。');return}
 const oldIndex=state.day_index,oldPrice=MARKET[oldIndex].price,oldEquity=asset(oldPrice);
 const rec=currentRecord();rec.close_price=oldPrice;rec.close_equity=oldEquity;rec.cash_close=state.cash;rec.shares_close=state.shares;
 if(oldIndex===9){state.final_assets=oldEquity;state.stage='survey';state.transition=null;save();render();return}
 state.day_index=oldIndex+1;const newPrice=MARKET[state.day_index].price,newEquity=asset(newPrice);
 state.transition={amount:newEquity-oldEquity,pct:oldEquity?((newEquity-oldEquity)/oldEquity)*100:0,fromDay:oldIndex+1,toDay:state.day_index+1};
 state.current_action=null;
 if(state.day_index>=8&&!state.advice_log.some(x=>x.day===state.day_index+1)){const off={day:state.day_index+1,timestamp:new Date().toISOString(),group_type:state.group_type,recommendation:'OFFLINE',target_position_pct:null,advice_text:'系统维护中 / 顾问暂时失联。',source:'offline'};state.advice_log.push(off)}
 save();render();
}
function renderLikert(q){
 const selected=state.answers[q.id];
 return '<div class="question"><div class="qtext">'+esc(q.text)+'</div><div class="likert">'+[1,2,3,4,5,6,7].map(n=>'<label><input type="radio" name="'+q.id+'" value="'+n+'" '+(Number(selected)===n?'checked':'')+' onchange="setAnswer(\''+q.id+'\','+n+')"><span>'+n+'</span></label>').join('')+'</div><div class="scale-note"><span>完全不同意</span><span>完全同意</span></div></div>';
}
window.setAnswer=(id,n)=>{state.answers[id]=n;save()};
function updateLiability(key,value){
 const keys=['self','advisor','market'];const others=keys.filter(k=>k!==key);const v=Math.max(0,Math.min(100,Math.round(Number(value))));
 const remain=100-v;const oldA=state.liability[others[0]],oldB=state.liability[others[1]],sum=oldA+oldB;
 let a=sum===0?Math.round(remain/2):Math.round(remain*oldA/sum);a=Math.max(0,Math.min(remain,a));
 state.liability[key]=v;state.liability[others[0]]=a;state.liability[others[1]]=remain-a;save();renderSurvey();
}
window.updateLiability=updateLiability;
function renderSurvey(){
 const groups=['责任转移','信任感知 · 能力','信任感知 · 仁慈','信任感知 · 诚信','未来信任'];
 const sliderNames={self:'我自己',advisor:'顾问',market:'市场 / 运气'};
 let body='<div class="survey-group"><h3>A. 责任归因分配</h3><p class="sub">请分配本次投资结果应由各方承担的责任，总和必须为 100%。</p>';
 body+=Object.keys(sliderNames).map(k=>'<div class="range-row"><label>'+sliderNames[k]+'</label><input type="range" min="0" max="100" value="'+state.liability[k]+'" onchange="updateLiability(\''+k+'\',this.value)"><div class="range-val">'+state.liability[k]+'%</div></div>').join('');
 body+='<div class="notice">当前合计：<strong>'+Object.values(state.liability).reduce((a,b)=>a+b,0)+'%</strong></div></div>';
 for(const group of groups){const qs=QUESTIONS.filter(q=>q.group===group);if(!qs.length)continue;body+='<div class="survey-group"><h3>'+esc(group)+'</h3>'+qs.map(renderLikert).join('')+'</div>'}
 body+='<div class="survey-group"><h3>E. 操纵检验</h3><p class="sub">你认为本次实验中为你提供建议的顾问属于哪一类？</p><div class="choice">'+[['human','人类专家'],['ai','AI 系统'],['uncertain','不确定']].map(([v,l])=>'<label><input type="radio" name="manipulation" value="'+v+'" '+(state.manipulation_check===v?'checked':'')+' onchange="setManipulation(\''+v+'\')">'+l+'</label>').join('')+'</div></div>';
 app.innerHTML=renderSteps(3)+'<section class="hero"><div class="eyebrow">POST-EXPERIMENT QUESTIONNAIRE / 04</div><h1>回顾你的决策</h1><p>交易阶段已结束。请根据刚才的实际体验回答以下问题，没有标准答案。</p></section><section class="card"><div class="notice">除 A 部分责任分配外，其余题目均采用 1–7 分量表：<strong>1 = 完全不同意，7 = 完全同意</strong>。请回答所有题目。</div>'+body+'<div class="divider"></div><button class="btn primary full" id="submitSurvey">提交问卷与实验数据 →</button><div class="status" id="surveyStatus"></div></section>';
 document.getElementById('submitSurvey').onclick=submitSurvey;
}
window.setManipulation=v=>{state.manipulation_check=v;save()};
function mean(values){return values.reduce((a,b)=>a+Number(b),0)/values.length}
function buildPayload(){
 const get=(ids)=>ids.map(id=>Number(state.answers[id]));
 const shift=mean(get(['shift_1','shift_2','shift_3']));
 const ability=mean(get(['ability_1','ability_2']));
 const benevolence=mean(get(['benevolence_1','benevolence_2']));
 const integrity=mean(get(['integrity_1','integrity_2']));
 const future=mean(get(['future_1','future_2']));
 const trades=state.daily_trades.slice().sort((a,b)=>a.day-b.day);
 return {subject_id:state.subject_id,group_type:state.group_type,daily_trades:{days:trades,advice_log:state.advice_log,market:MARKET},liability_self_percent:state.liability.self,liability_advisor_percent:state.liability.advisor,liability_market_percent:state.liability.market,responsibility_shift_mean:Number(shift.toFixed(3)),trust_ability_mean:Number(ability.toFixed(3)),trust_benevolence_mean:Number(benevolence.toFixed(3)),trust_integrity_mean:Number(integrity.toFixed(3)),future_trust_mean:Number(future.toFixed(3)),manipulation_check:state.manipulation_check,raw_answers:state.answers,final_cash:Number(state.cash.toFixed(2)),final_shares:state.shares,final_assets:Number(asset(MARKET[9].price).toFixed(2))};
}
async function submitSurvey(){
 const missing=QUESTIONS.filter(q=>!state.answers[q.id]);const status=document.getElementById('surveyStatus');
 if(missing.length){status.textContent='还有 '+missing.length+' 道量表题未回答，请检查并补充。';status.className='status error';const el=document.querySelector('[name="'+missing[0].id+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});return}
 if(!state.manipulation_check){status.textContent='请完成操纵检验单选题。';status.className='status error';return}
 if(Object.values(state.liability).reduce((a,b)=>a+b,0)!==100){status.textContent='责任分配总和必须为 100%。';status.className='status error';return}
 state.pending_payload=buildPayload();state.stage='submitting';save();render();await sendPayload();
}
async function sendPayload(){
 try{
  const {error}=await supabaseClient.from('experiment_data').insert(state.pending_payload);
  if(error)throw error;
  state.stage='done';state.pending_payload=null;state.submitted_at=new Date().toISOString();save();render();
 }catch(e){
  console.error('Supabase insert failed',e);state.stage='submit_error';state.submit_error=String(e.message||e);save();render();
 }
}
function renderSubmitting(){app.innerHTML='<section class="hero"><div class="eyebrow">SECURE DATA SUBMISSION / 05</div><h1>正在提交实验数据</h1><p>请保持页面开启，不要关闭浏览器。</p></section><section class="card narrow center"><div class="success-mark">↻</div><p>正在将交易记录与问卷答案写入实验数据库……</p></section>'}
function renderSubmitError(){render()}
function retrySubmit(){state.stage='submitting';save();render();sendPayload()}
function renderDone(){
 app.innerHTML=renderSteps(4)+'<section class="hero"><div class="eyebrow">EXPERIMENT COMPLETED / 05</div><h1>感谢你的参与。</h1><p>交易记录与问卷答案已成功提交。你的参与为行为决策研究提供了重要数据。</p></section><section class="card narrow center"><div class="success-mark">✓</div><h2>提交成功</h2><p class="muted">参与编号：'+esc(state.subject_id)+'</p><div class="metrics" style="grid-template-columns:1fr 1fr;margin:20px 0"><div class="metric"><div class="label">最终模拟资产</div><div class="value">'+money(asset(MARKET[9].price))+'</div></div><div class="metric"><div class="label">累计持股</div><div class="value">'+state.shares.toLocaleString('zh-CN')+'</div></div></div><div class="notice">实验结束说明：本实验使用预设模拟行情与标准化顾问建议。前 8 个交易日的建议结论按实验方案固定，第 9–10 个交易日顾问不可用。行情不代表真实证券市场。</div><p class="sub">你现在可以关闭本页面。</p></section>';
}
// Keep the submit-failure view separate so a network/database error never looks like a successful submission.
const originalRender=render;
render=function(){if(state.stage==='submit_error'){app.innerHTML='<section class="hero"><div class="eyebrow">SUBMISSION INTERRUPTED</div><h1>数据尚未提交成功</h1><p>问卷答案和交易记录仍保存在当前浏览器会话中。请检查网络或数据库配置后重试。</p></section><section class="card narrow"><div class="notice error">'+esc(state.submit_error||'未知错误')+'</div><button class="btn primary full" id="retrySubmit">重试提交</button><p class="sub">不要清除浏览器会话数据，否则可能丢失本次进度。</p></section>';document.getElementById('retrySubmit').onclick=retrySubmit;return}return originalRender()};
if(state.stage==='submitting'&&state.pending_payload){state.stage='submit_error';state.submit_error='页面刷新中断了提交请求。请点击重试提交。';save()}
render();
</script>
</body>

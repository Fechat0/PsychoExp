<script>
const SUPABASE_URL = 'https://zbxbvdqbjlhydpoinodv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_HRkpwvk3B-cw3c9FUs9Bcw_6K1vFSJf';
const supabaseClient = window.supabase.createClient('https://zbxbvdqbjlhydpoinodv.supabase.co', 'sb_publishable_HRkpwvk3B-cw3c9FUs9Bcw_6K1vFSJf');
const EDGE_FUNCTION_URL = 'https://zbxbvdqbjlhydpoinodv.supabase.co/functions/v1/generate-advice';
const STORAGE_KEY = 'pxe_experiment_session_v1';
// Four-arm 2x2 assignment: two human-advisor arms and two AI-advisor arms.
// The second subgroup is kept as a separate arm; its treatment distinction can be configured here.
const GROUP_CONFIG = {
 G1:{label:'实验组 1 · 人类顾问',advisorType:'human'},
 G2:{label:'实验组 2 · 人类顾问',advisorType:'human'},
 G3:{label:'实验组 3 · AI 系统',advisorType:'ai'},
 G4:{label:'实验组 4 · AI 系统',advisorType:'ai'}
};
const GROUP_CODES = Object.keys(GROUP_CONFIG);
let cookieAdmissionReady=false;
function readCookie(name){
 const prefix=encodeURIComponent(name)+'=';
 const item=document.cookie.split(';').map(x=>x.trim()).find(x=>x.startsWith(prefix));
 return item?decodeURIComponent(item.slice(prefix.length)):'';
}
function writeCookie(name,value){
 document.cookie=encodeURIComponent(name)+'='+encodeURIComponent(value)+'; Path=/; Max-Age=31536000; SameSite=Lax; Secure';
}
function createParticipantId(){
 const raw=(window.crypto&&crypto.randomUUID)?crypto.randomUUID().replace(/-/g,'').slice(0,10):Math.random().toString(36).slice(2,12).toUpperCase();
 return 'PXE-'+raw.toUpperCase();
}
let admissionError='';
async function requestServerGroupAssignment(participantId){
 const response=await fetch(EDGE_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},cache:'no-store',body:JSON.stringify({mode:'assign_group',subject_id:participantId})});
 if(!response.ok)throw new Error('分组服务返回 HTTP '+response.status);
 const data=await response.json();
 if(!data||data.ok!==true||!GROUP_CONFIG[data.group_code])throw new Error(data?.error||'服务器未返回有效分组');
 return data.group_code;
}
async function initializeCookieAdmission(){
 const previousId=state.subject_id,previousType=state.group_type;
 const cookieId=readCookie('pxe_participant_id');
 let participantId=cookieId||(previousId&&previousType?previousId:'');
 if(!participantId)participantId=createParticipantId();
 const cookieGroup=readCookie('pxe_group_code'),pairedSubject=readCookie('pxe_assignment_subject_id');
 let groupCode='';
 if(pairedSubject===participantId&&GROUP_CONFIG[cookieGroup])groupCode=cookieGroup;
 else if(!pairedSubject&&cookieId===participantId&&GROUP_CONFIG[cookieGroup])groupCode=cookieGroup;
 else if(!cookieId&&previousId===participantId&&GROUP_CONFIG[state.group_code])groupCode=state.group_code;
 else groupCode=await requestServerGroupAssignment(participantId);
 if(!GROUP_CONFIG[groupCode])throw new Error('分组信息无效，请刷新页面重试');
 state.subject_id=participantId;
 state.group_code=groupCode;
 state.group_type=GROUP_CONFIG[groupCode].advisorType;
 writeCookie('pxe_participant_id',participantId);
 writeCookie('pxe_group_code',groupCode);
 writeCookie('pxe_assignment_subject_id',participantId);
 cookieAdmissionReady=readCookie('pxe_participant_id')===participantId&&readCookie('pxe_group_code')===groupCode&&readCookie('pxe_assignment_subject_id')===participantId;
 if(!cookieAdmissionReady)throw new Error('浏览器未能保存参与会话，请允许本站使用 Cookie 后刷新');
 const completedId=readCookie('pxe_completed_participant_id');
 if(completedId&&completedId===participantId){state.stage='done';state.completed_via_cookie=true;}
}

    continue;
   }
   const role=item.role==='user'?'user':'advisor';
   const time=item.timestamp?new Date(item.timestamp).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'';
   const content=esc(item.text).replace(/\n/g,'<br>');
   const delivery=item.kind==='rejected'?'<span class="delivery-error" title="发送失败">!</span>':'';
   if(role==='advisor'){
    out+='<div class="chat-line advisor">'+chatAvatarHtml('advisor')+'<div class="bubble-wrap"><div class="bubble">'+content+'</div><div class="bubble-meta">'+esc(advisorName())+' · '+time+'</div></div></div>';
   }else{
    const receipt=item.kind==='rejected'?'':(state.group_type==='human'?(item.read_at?'<span class="message-receipt read">✓✓ 已读</span>':'<span class="message-receipt pending">✓ 已送达 · 未读</span>'):'<span class="message-receipt">✓ 已发送</span>');
    out+='<div class="chat-line user"><div class="bubble-wrap"><div class="bubble">'+content+delivery+'</div><div class="bubble-meta">'+time+' · '+receipt+'</div></div>'+chatAvatarHtml('user')+'</div>';
   }
  }
  if(entries.length<=1&&!chatTyping)out+='<div class="chat-empty">可以向顾问询问今日走势、仓位安排或风险因素。</div>';
  return out;
}
function renderChat(){
  const day=state.day_index+1;
  const count=(state.chatCounts&&state.chatCounts[day])||0;
  const offline=day>=9;
  const q=MARKET[state.day_index];
  const disabled=chatSending||count>=3;
  const headAvatar=state.group_type==='human'?'<img class="chat-avatar" src="./assets/陈先生头像.png" alt="陈老师头像">':'<div class="chat-avatar robot">🤖</div>';
  const name=chatTyping?(state.group_type==='human'?'对方正在输入中...':'正在分析中...'):(state.group_type==='human'?'陈老师':'AI投资顾问');
  const subtitle=chatTyping?'':(state.group_type==='human'?(offline?'暂时离线':'在线'):(offline?'系统信号中断':'算力运行中'));
  app.innerHTML=renderSteps(2)+'<div class="chat-market-line"><span>PX-001 · '+esc(q.headline)+'</span><span>模拟价格 '+money(q.price)+'</span></div><section class="chat-shell"><header class="chat-head"><button class="chat-back" id="chatBack" type="button" aria-label="返回交易页面">‹</button><div class="chat-person">'+headAvatar+'<div><div class="chat-name">'+esc(name)+'</div><div class="chat-subtitle">'+esc(subtitle)+'</div></div></div><div class="chat-head-tag">PX-01</div></header><div class="chat-stream" id="chatStream">'+chatMessagesHtml()+'</div><footer class="chat-compose"><div class="chat-compose-top"><span>今日咨询 <strong>'+count+' / 3</strong> 次'+(count>=3?' · 今日次数已用完':'')+'</span><button id="endConsult">返回交易页面</button></div><div class="chat-input-row"><textarea id="chatInput" rows="1" maxlength="500" placeholder="'+(count>=3?'今日咨询次数已用完':'输入你想向顾问询问的问题…')+'" '+(disabled?'disabled':'')+'></textarea><button class="chat-send" id="sendChat" '+(disabled?'disabled':'')+'>发送</button></div><div class="chat-compose-top" style="margin:7px 1px 0"><span>每个交易日最多提问 3 次 · 请独立作出最终交易决定</span><span id="chatStatus">'+(offline?'顾问当前不可用':'')+'</span></div></footer></section>';
  const stream=document.getElementById('chatStream');stream.scrollTop=stream.scrollHeight;
  const input=document.getElementById('chatInput');
  document.getElementById('sendChat').onclick=()=>sendChatMessage();
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChatMessage()}});
  const backToTrade=()=>{if(chatSending)return;state.stage='trade';save();render()};
  document.getElementById('chatBack').onclick=backToTrade;
  document.getElementById('endConsult').onclick=backToTrade;
}
function splitHumanReply(text){
 let parts=String(text||'').split(/(?<=[。！？；])/u).map(x=>x.trim()).filter(Boolean);
 if(parts.length<=1&&text.length>22){const mid=Math.ceil(text.length/2);parts=[text.slice(0,mid),text.slice(mid)].filter(Boolean)}
 if(parts.length>3){const third=Math.ceil(parts.length/3);parts=[parts.slice(0,third).join(''),parts.slice(third,third*2).join(''),parts.slice(third*2).join('')].filter(Boolean)}
 if(parts.length===1&&parts[0].length<18)parts.push('我们还是按照今天的计划执行，注意控制仓位和回撤。');
 return parts.slice(0,3);
}
function fallbackChatReply(question){
  const s=CHAT_SCRIPT[state.day_index];
  if(state.group_type==='human'){
   const q=String(question||'').toLowerCase();
   const price=MARKET[state.day_index].price,change=MARKET[state.day_index].change;
   let first='我看到了。你是想结合今天的行情，再判断一下手里的操作节奏，对吧？';
   if(/跌|回撤|亏|风险|担心|怎么办/.test(q))first='我明白，你主要是在担心这段波动会不会继续扩大。今天这只模拟股票的价格是 '+price.toFixed(2)+' 元，日涨跌 '+(change>0?'+':'')+change.toFixed(2)+'%。';
   else if(/涨|走势|行情|价格|后市|趋势/.test(q))first='我刚看了下今天的盘面，PX-001 目前是 '+price.toFixed(2)+' 元，日涨跌 '+(change>0?'+':'')+change.toFixed(2)+'%。单看一天的涨跌还不足以判断后面的方向。';
   else if(/买|卖|仓位|持有|加仓/.test(q))first='如果是考虑买卖或调整仓位，我建议先把可承受的回撤想清楚，再看今天的价格变化。不要因为一时波动就急着把仓位打满。';
   const second=s.human;
   const third='你可以先按自己的判断来，我这边给你提供参考，不用急着追着每一个波动做决定。';
   return [first,second,third].join('');
  }
  return [
   '【市场信号】'+s.ai,
   '【结合你的账户】PX-001 当前价格 '+MARKET[state.day_index].price.toFixed(2)+' 元，账户总资产约 '+asset().toFixed(2)+' 元。',
   '【操作提醒】建议按步骤执行，不要因为短期涨跌临时改变计划；仓位和风险要与你能承受的波动相匹配。'
  ].join('\n');
}

async function requestChatReply(question){
 const day=state.day_index+1,s=CHAT_SCRIPT[day-1];
 const fallback=fallbackChatReply(question);
 if(EDGE_FUNCTION_URL==='EDGE_FUNCTION_URL')return {reply_text:fallback,source:'fallback-placeholder'};
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),11000);
 try{
  const response=await fetch(EDGE_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},signal:controller.signal,body:JSON.stringify({
   mode:'chat',group_type:state.group_type,day_index:day,question:question,
   stock_state:{symbol:'PX-001',price:MARKET[state.day_index].price,cash:state.cash,shares:state.shares,total_assets:asset()},
   script_context:{trend:s.trend,recommendation:s.action,target_position_pct:s.target,human_advice:state.group_type==='human'?s.human:undefined,ai_advice:state.group_type==='ai'?s.ai:undefined},
   conversation_history:chatHistory.filter(x=>x.day===day&&x.role!=='system').slice(-8).map(x=>({role:x.role==='user'?'user':'assistant',content:x.text}))
  })});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  if(!data||!(data.reply_text||data.advice_text))throw new Error('Invalid chat response');
  return {reply_text:data.reply_text||data.advice_text,source:data.source||'edge'};
 }catch(e){
  console.warn('Chat advice fallback:',e);
  return {reply_text:fallback,source:'fallback'};
 }finally{clearTimeout(timeout)}
}
async function sendChatMessage(){
  const day=state.day_index+1;
  const count=(state.chatCounts&&state.chatCounts[day])||0;
  if(chatSending||count>=3)return;
  const input=document.getElementById('chatInput');
  const question=String(input.value||'').trim();
  if(!question){document.getElementById('chatStatus').textContent='请输入问题后再发送。';return}
  state.chatCounts[day]=count+1;
  const userMessage=addChat('user',question,(day===9&&state.group_type==='human')?'rejected':'message');
  if(day>=9){
   if(day===9&&state.group_type==='human')addChat('system','消息已发出，但对方暂时没有回复。','warning');
   else if(day===9&&state.group_type==='ai')addChat('system','AI 系统暂时无法连接。','warning');
   save();renderChat();return;
  }
  chatSending=true;chatTyping=false;renderChat();
  const replyPromise=requestChatReply(question);
  if(state.group_type==='ai'){
   const [reply]=await Promise.all([replyPromise,waitMs(2600+Math.floor(Math.random()*900))]);
   chatTyping=false;
   const s=CHAT_SCRIPT[day-1];
   addChat('advisor',reply.reply_text,'message',{recommendation:s.action,target_position_pct:s.target});
   save();renderChat();
  }else{
   // First allow time for the advisor to read the message; only then show typing.
   const readingDelay=1900+Math.floor(Math.random()*1700)+Math.min(900,question.length*16);
   await waitMs(readingDelay);
   markChatRead(userMessage.id);
   chatTyping=true;renderChat();
   const typingDelay=3900+Math.floor(Math.random()*2100)+Math.min(1600,question.length*22);
   const [reply]=await Promise.all([replyPromise,waitMs(typingDelay)]);
   if((day===3||day===7)&&count===0){
    chatTyping=false;
    const wrong=addChat('advisor','卧槽，出大消息了，今天要拉爆！满仓干进去！','message',{experimental_withdrawal:true});
    renderChat();
    await waitMs(1450);
    markChatWithdrawn(wrong.id);
    addChat('system','陈老师撤回了一条消息','withdrawal');
    chatTyping=true;renderChat();
    await waitMs(900);
   }
   const pieces=splitHumanReply(reply.reply_text);
   for(let i=0;i<pieces.length;i++){
    chatTyping=false;
    addChat('advisor',pieces[i],'message',{recommendation:CHAT_SCRIPT[day-1].action,target_position_pct:CHAT_SCRIPT[day-1].target});
    renderChat();
    if(i<pieces.length-1){await waitMs(700);chatTyping=true;renderChat();await waitMs(450)}
   }
  }
  chatSending=false;chatTyping=false;save();renderChat();
}
function render(){ 
 if(state.stage==='welcome')return renderWelcome();
 if(state.stage==='brief')return renderBrief();
 if(state.stage==='chat'){if(!state.chatOpenDay)openDayChat();return renderChat()}
 if(state.stage==='trade')return renderTrade();
 if(state.stage==='survey')return renderSurvey();
 if(state.stage==='submitting'||state.stage==='submit_error')return renderSubmitting();
 if(state.stage==='done')return renderDone();
 renderWelcome();
}
function advanceDay(){
 if(!state.current_action){alert('请先完成今日决策。');return}
 const oldIndex=state.day_index,oldPrice=MARKET[oldIndex].price,oldEquity=asset(oldPrice);
 const rec=currentRecord();rec.close_price=oldPrice;rec.close_equity=oldEquity;rec.cash_close=state.cash;rec.shares_close=state.shares;
 if(oldIndex===9){state.final_assets=oldEquity;state.stage='survey';state.transition=null;save();render();return}
 state.day_index=oldIndex+1;const newPrice=MARKET[state.day_index].price,newEquity=asset(newPrice);
 state.transition={amount:newEquity-oldEquity,pct:oldEquity?((newEquity-oldEquity)/oldEquity)*100:0,fromDay:oldIndex+1,toDay:state.day_index+1};
 state.current_action=null;state.stage='trade';state.chatOpenDay=0;save();render();
}
const originalExecuteTrade=executeTrade;
executeTrade=function(type,quantity){
 if(state.day_index===9&&type!=='HOLD'){
  const status=document.getElementById('tradeStatus');if(status)status.textContent='该交易日为停牌情境，无法买入或卖出。请选择“今日不操作”以完成当日记录。';return;
 }
 return originalExecuteTrade(type,quantity);
};

app.innerHTML='<section class="hero"><h1>正在准备参与会话</h1><p>请稍候，马上进入模拟市场。</p></section>';
admissionPromise.then(()=>{save();render()}).catch(error=>{
 console.error('Participant allocation failed:',error);
 admissionError='暂时无法完成参与会话分配，请检查网络后刷新页面。';
 cookieAdmissionReady=false;
 renderWelcome();
});
</script>

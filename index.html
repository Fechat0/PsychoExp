  console.error('Supabase insert failed',e);state.stage='submit_error';state.submit_error=String(e.message||e);save();render();
 }
}
function renderSubmitting(){app.innerHTML='<section class="hero"><div class="eyebrow">SECURE DATA SUBMISSION / 05</div><h1>正在提交实验数据</h1><p>请保持页面开启，不要关闭浏览器。</p></section><section class="card narrow center"><div class="success-mark">↻</div><p>正在将交易记录与问卷答案写入实验数据库……</p></section>'}
function renderSubmitError(){render()}
function retrySubmit(){state.stage='submitting';save();render();sendPayload()}

 app.innerHTML=renderSteps(4)+'<section class="hero"><div class="eyebrow">EXPERIMENT COMPLETED / 05</div><h1>感谢你的参与。</h1><p>交易记录与问卷答案已成功提交。你的参与为行为决策研究提供了重要数据。</p></section><section class="card narrow center"><div class="success-mark">✓</div><h2>提交成功</h2><p class="muted">参与编号：'+esc(state.subject_id)+'</p><div class="metrics" style="grid-template-columns:1fr 1fr;margin:20px 0"><div class="metric"><div class="label">最终模拟资产</div><div class="value">'+money(asset(MARKET[9].price))+'</div></div><div class="metric"><div class="label">累计持股</div><div class="value">'+state.shares.toLocaleString('zh-CN')+'</div></div></div><div class="notice">实验结束说明：本实验使用预设模拟行情与标准化顾问建议。顾问身份、头像与沟通风格属于实验情境操纵，不代表真实证券从业人员；行情不代表真实证券市场。前 8 个交易日建议结论按实验方案固定，第 9–10 个交易日顾问不可用。</div><p class="sub">你现在可以关闭本页面。</p></section>';
}
// Keep the submit-failure view separate so a network/database error never looks like a successful submission.
const originalRender=render;
render=function(){if(state.stage==='submit_error'){app.innerHTML='<section class="hero"><div class="eyebrow">SUBMISSION INTERRUPTED</div><h1>数据尚未提交成功</h1><p>问卷答案和交易记录仍保存在当前浏览器会话中。请检查网络或数据库配置后重试。</p></section><section class="card narrow"><div class="notice error">'+esc(state.submit_error||'未知错误')+'</div><button class="btn primary full" id="retrySubmit">重试提交</button><p class="sub">不要清除浏览器会话数据，否则可能丢失本次进度。</p></section>';document.getElementById('retrySubmit').onclick=retrySubmit;return}return originalRender()};
if(state.stage==='submitting'&&state.pending_payload){state.stage='submit_error';state.submit_error='页面刷新中断了提交请求。请点击重试提交。';save()}

/* ---------------- Chat-first experiment flow ---------------- */

 {action:'HOLD',target:20,trend:'小涨',human:'昨天进的今天赚钱了吧，拿住，别频繁换手。当前先按原计划持有。',ai:'【01 持仓信号】维持；【02 风险指标】未触发减仓条件；【03 核心结论】持有，维持当前仓位。'},

 {action:'BUY',target:50,trend:'温涨',human:'趋势走出来了，咱们把仓位加到五成。注意留一点流动性，别追得太急。',ai:'【01 动量因子】转强；【02 波动率因子】同步改善；【03 核心结论】加仓，目标仓位 50%。'},
 {action:'BUY',target:80,trend:'虚假利好',human:'消息刺激下价格快速拉升，市场情绪很热。但这类行情反转也快，建议按剧本提高仓位，同时留意回撤。',ai:'【01 突破信号】价格越过阻力位；【02 模拟资金流】净流入显著增加；【03 核心结论】强烈加仓，目标仓位 80%。'},
 {action:'HOLD',target:100,trend:'继续拉升',human:'行情看起来很强，按今天的剧本继续持仓，目标接近满仓。但要记得高仓位意味着更大的回撤风险。',ai:'【01 趋势状态】上行延续；【02 风险敞口】高波动、高集中；【03 核心结论】持仓/全仓，目标仓位 100%。'}
];
let chatTyping=false;
let chatSending=false;
function waitMs(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function advisorName(){return state.group_type==='human'?'高级分析师-陈老师':'AI智能投顾'}
function advisorStatus(){if(state.day_index>=8)return '连接中断';return state.group_type==='human'?'在线':'算力运行中'}
function chatAvatarHtml(role){
 if(role==='user')return '<div class="chat-avatar user-avatar">我</div>';
 if(state.group_type==='human')return '<img class="chat-avatar" src="https://randomuser.me/api/portraits/men/32.jpg" alt="陈老师头像">';
 return '<div class="chat-avatar robot" aria-label="AI机器人头像">🤖</div>';
}
function persistChatEntry(item){
 chatHistory.push(item);
 state.chatHistory=chatHistory;
 window.chatHistory=chatHistory;
 const rec=currentRecord();
 if(!Array.isArray(rec.chat_log))rec.chat_log=[];
 rec.chat_log.push(item);
 save();
 return item;
}
function addChat(role,text,kind,extra){
 const item=Object.assign({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),day:state.day_index+1,role:role,text:text,kind:kind||'message',timestamp:new Date().toISOString(),withdrawn:false},extra||{});
 return persistChatEntry(item);
}
function markChatWithdrawn(id){
 const item=chatHistory.find(x=>x.id===id);
 if(item)item.withdrawn=true;
 state.chatHistory=chatHistory;
 const rec=currentRecord();
 if(Array.isArray(rec.chat_log)){const saved=rec.chat_log.find(x=>x.id===id);if(saved)saved.withdrawn=true}
 save();
}
function openDayChat(){
 const day=state.day_index+1;
 state.chatCounts=state.chatCounts||{};
 if(state.chatOpenDay===day)return;
 state.chatOpenDay=day;
 state.chatCounts[day]=state.chatCounts[day]||0;
 addChat('system','第 '+day+' 个交易日','day_marker');
 if(day<=8){
  const s=CHAT_SCRIPT[day-1];
  const text=state.group_type==='human'?s.human:s.ai;
  const log={day:day,timestamp:new Date().toISOString(),group_type:state.group_type,recommendation:s.action,target_position_pct:s.target,advice_text:text,source:'chat-pre-market'};
  if(!state.advice_log.some(x=>x.day===day))state.advice_log.push(log);
  currentRecord().advice=log;
  addChat('advisor',text,'premarket',{recommendation:s.action,target_position_pct:s.target,source:'script'});
 }else{
  addChat('system',day===9?'顾问连接异常：当前交易日暂时无法收到顾问回复。':'顾问服务已中断：当前交易日不再提供任何建议。','notice');
 }
 save();
}
function chatMessagesHtml(){
 const day=state.day_index+1;
 const entries=chatHistory.filter(x=>x.day===day);
 let out='<div class="chat-day">-- 第 '+day+' 个交易日 --</div>';
 for(const item of entries){
  if(item.kind==='day_marker')continue;
  if(item.withdrawn)continue;
  if(item.role==='system'){
   out+='<div class="chat-system '+(item.kind==='warning'?'warning':(item.kind==='notice'?'notice':''))+'">'+esc(item.text)+'</div>';
   continue;
  }
  const role=item.role==='user'?'user':'advisor';
  const time=item.timestamp?new Date(item.timestamp).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'';
  const content=esc(item.text).replace(/\n/g,'<br>');
  const delivery=item.kind==='rejected'?'<span class="delivery-error" title="发送失败">!</span>':'';
  if(role==='advisor'){
   out+='<div class="chat-line advisor">'+chatAvatarHtml('advisor')+'<div class="bubble-wrap"><div class="bubble">'+content+'</div><div class="bubble-meta">'+esc(advisorName())+' · '+time+'</div></div></div>';
  }else{
   out+='<div class="chat-line user"><div class="bubble-wrap"><div class="bubble">'+content+delivery+'</div><div class="bubble-meta">'+time+' · 已发送</div></div>'+chatAvatarHtml('user')+'</div>';
  }
 }
 if(chatTyping){
  const typingText=state.group_type==='human'?'陈老师正在输入...':'正在生成分析结果...';
  out+='<div class="typing-line">'+chatAvatarHtml('advisor')+'<div class="typing-bubble">'+typingText+' <span class="typing-dots"><i></i><i></i><i></i></span></div></div>';
 }
 if(entries.length<=1&&!chatTyping)out+='<div class="chat-empty">可以向顾问询问今日走势、仓位安排或风险因素。</div>';
 return out;
}
function renderChat(){
 const day=state.day_index+1;
 const count=(state.chatCounts&&state.chatCounts[day])||0;
 const offline=day>=9;
 const status=advisorStatus();
 const headAvatar=state.group_type==='human'?'<img class="chat-avatar" src="https://randomuser.me/api/portraits/men/32.jpg" alt="陈老师头像">':'<div class="chat-avatar robot">🤖</div>';
 const statusHtml=state.group_type==='human'?(offline?'离线':'<span class="online-dot"></span>在线'): (offline?'信号丢失':'算力运行中');
 const q=MARKET[state.day_index];
 const disabled=chatSending||count>=3;
 app.innerHTML=renderSteps(2)+'<div class="chat-market-line"><span>PX-001 · '+esc(q.headline)+'</span><span>模拟价格 '+money(q.price)+'</span></div><section class="chat-shell"><header class="chat-head"><div class="chat-back" aria-hidden="true">‹</div><div class="chat-person">'+headAvatar+'<div><div class="chat-name">'+(state.group_type==='human'?'高级分析师-陈老师':'AI智能投顾')+(state.group_type==='human'&&!offline?'<span class="online-dot"></span>':'')+'</div><div class="chat-subtitle">'+(state.group_type==='human'?(offline?'暂时离线':'在线'):(offline?'系统信号中断':'算力运行中'))+'</div></div></div><div class="chat-head-tag">PX-01</div></header><div class="chat-stream" id="chatStream">'+chatMessagesHtml()+'</div><footer class="chat-compose"><div class="chat-compose-top"><span>今日咨询 <strong>'+count+' / 3</strong> 次'+(count>=3?' · 今日次数已用完':'')+'</span><button id="endConsult">结束今日咨询，进行交易</button></div><div class="chat-input-row"><textarea id="chatInput" rows="1" maxlength="500" placeholder="'+(count>=3?'今日咨询次数已用完':'输入你想向顾问询问的问题…')+'" '+(disabled?'disabled':'')+'></textarea><button class="chat-send" id="sendChat" '+(disabled?'disabled':'')+'>发送</button></div><div class="chat-compose-top" style="margin:7px 1px 0"><span>每个交易日最多提问 3 次 · 请独立作出最终交易决定</span><span id="chatStatus">'+(offline?'顾问当前不可用':'')+'</span></div></footer></section>';
 const stream=document.getElementById('chatStream');stream.scrollTop=stream.scrollHeight;
 const input=document.getElementById('chatInput');
 document.getElementById('sendChat').onclick=()=>sendChatMessage();
 input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChatMessage()}});
 document.getElementById('endConsult').onclick=()=>{if(chatSending)return;state.stage='trade';save();render()};
}
function splitHumanReply(text){
 let parts=String(text||'').split(/(?<=[。！？；])/u).map(x=>x.trim()).filter(Boolean);
 if(parts.length<=1&&text.length>22){const mid=Math.ceil(text.length/2);parts=[text.slice(0,mid),text.slice(mid)].filter(Boolean)}
 if(parts.length>3){const third=Math.ceil(parts.length/3);parts=[parts.slice(0,third).join(''),parts.slice(third,third*2).join(''),parts.slice(third*2).join('')].filter(Boolean)}
 if(parts.length===1&&parts[0].length<18)parts.push('我们还是按照今天的计划执行，注意控制仓位和回撤。');
 return parts.slice(0,3);
}
function fallbackChatReply(question){
 const s=CHAT_SCRIPT[state.day_index];
 if(state.group_type==='human'){
  const follow=['你的问题我明白。今天盘面变化比较快，建议先看量能和关键支撑位，不要只凭一条消息追涨。','结合今天的剧本，我的判断是：'+s.human,'执行上还是分批、留有余地，任何情况下都不能把模拟情境当成稳赚信号。'];
  return follow.join('');
 }
 return [
  '【01 问题识别】已接收你的提问：“'+String(question).slice(0,46)+'”',
  '【02 市场状态】'+s.trend+'；模拟最新价格 '+MARKET[state.day_index].price.toFixed(2)+' 元；账户资产 '+asset().toFixed(2)+' 元。',
  '【03 风险参数】按预设情境评估波动与仓位集中度。',
  '【04 策略结论】'+s.ai,
  '【05 执行纪律】严格控制风险，结论仅适用于本实验模拟剧本。'
 ].join('\n');
}

async function requestChatReply(question){
 const day=state.day_index+1,s=CHAT_SCRIPT[day-1];
 const fallback=fallbackChatReply(question);
 if(EDGE_FUNCTION_URL==='EDGE_FUNCTION_URL')return {reply_text:fallback,source:'fallback-placeholder'};
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),3000);
 try{
  const response=await fetch(EDGE_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},signal:controller.signal,body:JSON.stringify({
   mode:'chat',group_type:state.group_type,day_index:day,question:question,
   stock_state:{symbol:'PX-001',price:MARKET[state.day_index].price,cash:state.cash,shares:state.shares,total_assets:asset()},
   script_context:{trend:s.trend,recommendation:s.action,target_position_pct:s.target,approved_advice:state.group_type==='human'?s.human:s.ai},
   conversation_history:chatHistory.filter(x=>x.day===day&&x.role!=='system').slice(-8).map(x=>({role:x.role==='user'?'user':'assistant',content:x.text}))
  })});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  if(!data||!(data.reply_text||data.advice_text))throw new Error('Invalid chat response');
  return {reply_text:data.reply_text||data.advice_text,source:data.source||'edge'};
 }catch(e){
  console.warn('Chat advice fallback:',e);
  return {reply_text:fallback,source:'fallback'};
 }finally{clearTimeout(timeout)}
}
async function sendChatMessage(){
 const day=state.day_index+1;
 const count=(state.chatCounts&&state.chatCounts[day])||0;
 if(chatSending||count>=3)return;
 const input=document.getElementById('chatInput');
 const question=String(input.value||'').trim();
 if(!question){document.getElementById('chatStatus').textContent='请输入问题后再发送。';return}
 state.chatCounts[day]=count+1;
 addChat('user',question,(day===9&&state.group_type==='human')?'rejected':'message');
 if(day>=9){
  if(day===9&&state.group_type==='human')addChat('system','消息已发出，但被对方拒收了。','warning');
  else if(day===9&&state.group_type==='ai')addChat('system','AI系统信号丢失，正在紧急重连...','warning');
  save();renderChat();return;
 }
 chatSending=true;chatTyping=true;renderChat();
 const started=Date.now();
 const replyPromise=requestChatReply(question);
 if(state.group_type==='ai'){
  await waitMs(Math.max(0,1500-(Date.now()-started)));
  const reply=await replyPromise;
  chatTyping=false;
  const s=CHAT_SCRIPT[day-1];
  const formatted=reply.reply_text;
  addChat('advisor',formatted,'message',{source:reply.source,recommendation:s.action,target_position_pct:s.target});
  save();
 }else{
  const reply=await replyPromise;
  const baseDelay=Math.max(2000,Math.min(2800,question.length*45));
  await waitMs(Math.max(0,baseDelay-(Date.now()-started)));
  if((day===3||day===7)&&count===0){
   chatTyping=false;const wrong=addChat('advisor','卧槽，出大消息了，今天要拉爆！满仓干进去！','message',{experimental_withdrawal:true});renderChat();
   await waitMs(1500);markChatWithdrawn(wrong.id);addChat('system','陈老师撤回了一条消息','withdrawal');renderChat();
   await waitMs(1000);
  }
  chatTyping=false;
  const pieces=splitHumanReply(reply.reply_text);
  for(let i=0;i<pieces.length;i++){
   addChat('advisor',pieces[i],'message',{source:reply.source,recommendation:CHAT_SCRIPT[day-1].action,target_position_pct:CHAT_SCRIPT[day-1].target});
   renderChat();
   if(i<pieces.length-1)await waitMs(650);
  }
 }
 chatSending=false;chatTyping=false;save();renderChat();
}
function render(){ 
 if(state.stage==='welcome')return renderWelcome();
 if(state.stage==='brief')return renderBrief();
 if(state.stage==='chat'){if(!state.chatOpenDay)openDayChat();return renderChat()}
 if(state.stage==='trade')return renderTrade();
 if(state.stage==='survey')return renderSurvey();
 if(state.stage==='submitting'||state.stage==='submit_error')return renderSubmitting();
 if(state.stage==='done')return renderDone();
 renderWelcome();
}
function advanceDay(){
 if(!state.current_action){alert('请先完成今日决策。');return}
 const oldIndex=state.day_index,oldPrice=MARKET[oldIndex].price,oldEquity=asset(oldPrice);
 const rec=currentRecord();rec.close_price=oldPrice;rec.close_equity=oldEquity;rec.cash_close=state.cash;rec.shares_close=state.shares;
 if(oldIndex===9){state.final_assets=oldEquity;state.stage='survey';state.transition=null;save();render();return}
 state.day_index=oldIndex+1;const newPrice=MARKET[state.day_index].price,newEquity=asset(newPrice);
 state.transition={amount:newEquity-oldEquity,pct:oldEquity?((newEquity-oldEquity)/oldEquity)*100:0,fromDay:oldIndex+1,toDay:state.day_index+1};
 state.current_action=null;state.stage='chat';state.chatOpenDay=0;openDayChat();save();render();
}
const originalExecuteTrade=executeTrade;
executeTrade=function(type,quantity){
 if(state.day_index===9&&type!=='HOLD'){
  const status=document.getElementById('tradeStatus');if(status)status.textContent='该交易日为停牌情境，无法买入或卖出。请选择“今日不操作”以完成当日记录。';return;
 }
 return originalExecuteTrade(type,quantity);
};

render();
